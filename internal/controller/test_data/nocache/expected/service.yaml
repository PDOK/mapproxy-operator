kind: Service
apiVersion: v1
metadata:
  name: nocache-wmts-mapproxy
  namespace: default
  labels:
    pdok.nl/app: mapproxy
    pdok.nl/dataset-id: dataset
    pdok.nl/owner-id: owner
    pdok.nl/service-type: wmts
    pdok.nl/service-version: v1_0
  ownerReferences:
    - apiVersion: pdok.nl/v2
      kind: WMTS
      name: nocache
      uid: ""
      controller: true
      blockOwnerDeletion: true
spec:
  ports:
    - name: mapproxy
      protocol: "TCP"
      port: 80
      targetPort: 80
    - name: metric
      protocol: "TCP"
      port: 9117
      targetPort: 9117
  selector:
    pdok.nl/app: mapproxy
    pdok.nl/dataset-id: dataset
    pdok.nl/owner-id: owner
    pdok.nl/service-type: wmts
    pdok.nl/service-version: v1_0
  type: ClusterIP
  sessionAffinity: None
  internalTrafficPolicy: "Cluster"